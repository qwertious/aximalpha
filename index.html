			if (!debugGraph.edgeKeySet.has(eKey)) {
				debugGraph.edgeKeySet.add(eKey);
				debugGraph.edges.push({ source: fromId, target: toId, reason });
				debugGraph.pendingEdgeRebuild = true;
			}

			if (addedNode) {
				debugGraph.rankableKeys.push(toKey);
				debugGraph.termsByKey.set(toKey, cloneTerm(toTerm));
			}
			// Coalesced into the animation frame — see debugGraph.pendingEdgeRebuild.
			debugGraph.pendingHighlightRefresh = true;
			return addedNode;
		}

		function rebuildDebugRenderables() {
			disposeDebugRenderables();
			if (!debugNodeGroup || !debugEdgeGroup) return;

			for (const node of debugGraph.nodes) {
				const geometry = new THREE.SphereGeometry(2.2, 12, 12);
				const material = new THREE.MeshPhongMaterial({ color: 0x66c2ff });
				const mesh = new THREE.Mesh(geometry, material);
				const nodeScale = debugGraphSettings.nodeSize / 2.2;
				mesh.scale.set(nodeScale, nodeScale, nodeScale);
				mesh.position.set(node.x, node.y, node.z);
				mesh.userData.nodeId = node.id;
				debugNodeMeshes.push(mesh);
				debugNodeGroup.add(mesh);
			}

			debugEdgePositions = new Float32Array(debugGraph.edges.length * 6);
			const edgeGeometry = new THREE.BufferGeometry();
			edgeGeometry.setAttribute("position", new THREE.BufferAttribute(debugEdgePositions, 3));
			const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x9baec5, transparent: true, opacity: 0.35 });
			debugEdgeLine = new THREE.LineSegments(edgeGeometry, edgeMaterial);
			debugEdgeGroup.add(debugEdgeLine);
			updateDebugEdgePositions();
			applyDebugNodeColors();
		}

		function updateDebugEdgePositions() {
			if (!debugEdgePositions || !debugEdgeLine) return;
			let ptr = 0;
			for (const edge of debugGraph.edges) {
				const a = debugGraph.nodes[edge.source];
				const b = debugGraph.nodes[edge.target];
				if (!a || !b) continue;
				debugEdgePositions[ptr++] = a.x;
				debugEdgePositions[ptr++] = a.y;
				debugEdgePositions[ptr++] = a.z;
				debugEdgePositions[ptr++] = b.x;
				debugEdgePositions[ptr++] = b.y;
				debugEdgePositions[ptr++] = b.z;
			}
			debugEdgeLine.geometry.attributes.position.needsUpdate = true;
			debugEdgeLine.geometry.computeBoundingSphere();
		}

		function applyDebugNodeColors() {
			for (let i = 0; i < debugNodeMeshes.length; i += 1) {
				const mesh = debugNodeMeshes[i];
				const node = debugGraph.nodes[i];
				if (!mesh || !node) continue;
				const isSelected = node.id === debugGraph.selectedNodeId;
				const isHighlighted = debugGraph.highlightedKeys.has(node.key);
				if (isSelected) {
					mesh.material.color.setHex(0xffcc66);
				} else if (isHighlighted) {
					mesh.material.color.setHex(0x57d86c);
				} else {
					mesh.material.color.setHex(0x66c2ff);
				}
			}
		}

		function fitDebugCameraToGraph() {
			if (!debugCamera || debugGraph.nodes.length === 0) return;
			let maxR = 10;
			for (const node of debugGraph.nodes) {
				const r = Math.sqrt(node.x * node.x + node.y * node.y + node.z * node.z);
				if (r > maxR) maxR = r;
			}
			debugCameraControls.radius = Math.max(80, maxR * 2.8);
			updateDebugCamera();
		}

		function updateDebugCamera() {
			if (!debugCamera) return;
			const r = debugCameraControls.radius;
			const rx = debugCameraControls.rotX;
			const ry = debugCameraControls.rotY;
			debugCamera.position.x = r * Math.cos(rx) * Math.sin(ry);
			debugCamera.position.y = r * Math.sin(rx);
			debugCamera.position.z = r * Math.cos(rx) * Math.cos(ry);
			debugCamera.lookAt(0, 0, 0);
		}

		function onDebugMouseDown(event) {
			if (!graphPanel.classList.contains("visible")) return;
			if (event.button !== 0) return;
			debugIsRotating = true;
			debugLastMouseX = event.clientX;
			debugLastMouseY = event.clientY;
			debugMouseDownX = event.clientX;
			debugMouseDownY = event.clientY;
		}

		function onDebugMouseMove(event) {
			if (!debugIsRotating) return;
			const dx = event.clientX - debugLastMouseX;
			const dy = event.clientY - debugLastMouseY;
			debugLastMouseX = event.clientX;
			debugLastMouseY = event.clientY;
			debugCameraControls.rotY += dx * 0.008;
			debugCameraControls.rotX += dy * 0.008;
			debugCameraControls.rotX = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, debugCameraControls.rotX));
		}

		function onDebugMouseUp(event) {
			if (event && debugIsRotating) {
				const dragDistance = Math.hypot(event.clientX - debugMouseDownX, event.clientY - debugMouseDownY);
				if (dragDistance < 4) {
					pickDebugNode(event.clientX, event.clientY);
				}
			}
			debugIsRotating = false;
		}

		function onDebugMouseWheel(event) {
			if (!graphPanel.classList.contains("visible")) return;
			event.preventDefault();
			debugCameraControls.radius += event.deltaY * 0.08;
			debugCameraControls.radius = Math.max(25, Math.min(3000, debugCameraControls.radius));
		}

		function pickDebugNode(clientX, clientY) {
			if (!debugCamera || !debugRaycaster || debugNodeMeshes.length === 0) return;
			const rect = graphCanvas.getBoundingClientRect();
			const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
			const ny = -((clientY - rect.top) / rect.height) * 2 + 1;
			debugPointer.set(nx, ny);
			debugRaycaster.setFromCamera(debugPointer, debugCamera);
			debugRaycaster.far = Math.max(1000, debugCameraControls.radius * 2);
			const hits = debugRaycaster.intersectObjects(debugNodeMeshes, false);
			if (hits.length === 0) return;
			const id = hits[0].object.userData.nodeId;
			debugGraph.selectedNodeId = id;
			const node = debugGraph.nodes.find((n) => n.id === id);
			graphSelectedState.textContent = node ? node.key : "(none)";
			applyDebugNodeColors();
		}

		function simulateDebugGraphStep() {
			const nodes = debugGraph.nodes;
			const edges = debugGraph.edges;
			if (nodes.length === 0) return;

			const repulsion = debugGraphSettings.repulsion;
			const spring = debugGraphSettings.spring;
			const targetLength = debugGraphSettings.edgeLength;
			const damping = debugGraphSettings.damping;
			const collisionPush = 0.12;
			const minDistance = debugGraphSettings.minDistance;
			const centering = 0.0007;
			const maxSpeed = 2.2;

			for (const node of nodes) {
				node.fx = -node.x * centering;
				node.fy = -node.y * centering;
				node.fz = -node.z * centering;
			}

			for (let i = 0; i < nodes.length; i += 1) {
				const a = nodes[i];
				for (let j = i + 1; j < nodes.length; j += 1) {
					const b = nodes[j];
					let dx = a.x - b.x;
					let dy = a.y - b.y;
					let dz = a.z - b.z;
					let distSq = dx * dx + dy * dy + dz * dz;
					if (distSq < 0.0001) {
						dx = (Math.random() - 0.5) * 0.1;
						dy = (Math.random() - 0.5) * 0.1;
						dz = (Math.random() - 0.5) * 0.1;
						distSq = dx * dx + dy * dy + dz * dz;
					}
					const dist = Math.sqrt(distSq);
					let force = repulsion / distSq;
					if (dist < minDistance) {
						force += (minDistance - dist) * collisionPush;
					}
					const fx = (dx / dist) * force;
					const fy = (dy / dist) * force;
					const fz = (dz / dist) * force;
					a.fx += fx;
					a.fy += fy;
					a.fz += fz;
					b.fx -= fx;
					b.fy -= fy;
					b.fz -= fz;
				}
			}

			for (const edge of edges) {
				const a = nodes[edge.source];
				const b = nodes[edge.target];
				const dx = b.x - a.x;
				const dy = b.y - a.y;
				const dz = b.z - a.z;
				const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.0001;
				const displacement = dist - targetLength;
				const force = spring * displacement;
				const fx = (dx / dist) * force;
				const fy = (dy / dist) * force;
				const fz = (dz / dist) * force;
				a.fx += fx;
				a.fy += fy;
				a.fz += fz;
				b.fx -= fx;
				b.fy -= fy;
				b.fz -= fz;
			}

			for (const node of nodes) {
				node.vx = (node.vx + node.fx) * damping;
				node.vy = (node.vy + node.fy) * damping;
				node.vz = (node.vz + node.fz) * damping;

				const speed = Math.sqrt(node.vx * node.vx + node.vy * node.vy + node.vz * node.vz);
				if (speed > maxSpeed) {
					const cap = maxSpeed / speed;
					node.vx *= cap;
					node.vy *= cap;
					node.vz *= cap;
				}

				node.x += node.vx;
				node.y += node.vy;
				node.z += node.vz;
			}

			for (let i = 0; i < debugNodeMeshes.length; i += 1) {
				const mesh = debugNodeMeshes[i];
				const node = nodes[i];
				if (!mesh || !node) continue;
				mesh.position.set(node.x, node.y, node.z);
			}
			updateDebugEdgePositions();
			fitDebugCameraToGraph();
		}

		async function runPathsCommand(maxVisitedText, expressionText) {
			const maxVisited = Number(maxVisitedText);
			if (!Number.isFinite(maxVisited) || maxVisited < 1) {
				print("Usage: paths [maxVisited>=1] [expression]", "err");
				return;
			}

			const { expressionText: exprOnly, targetFunctions } = parseExpressionWithTarget(expressionText);
			const parsed = parseExpression(exprOnly);
			const cfg = getEffectiveHeuristicConfig(parsed, null, targetFunctions);
			const solved = await solveWithProgress(parsed, Math.floor(maxVisited), {
				label: `Paths ${termToString(parsed)}`,
				cancellable: true,
				targetFunctions
			});
			if (!solved) return;

			const stateKeySet = new Set(solved.exploredOrder);
			for (const edge of solved.edges || []) {
				stateKeySet.add(edge.from);
				stateKeySet.add(edge.to);
			}
			const stateKeys = [...stateKeySet];

			const termsByKey = new Map();
			for (const key of stateKeys) {
				try {
					termsByKey.set(key, parseExpression(key));
				} catch {}
			}
			const topCount = getTopHighlightCount();
			const topKeys = computeTopSimplifiedKeys(stateKeys, termsByKey, topCount, cfg);

			showDebugGraph({
				exploredOrder: stateKeys,
				edges: solved.edges,
				path: solved.path
			}, topKeys, termsByKey, cfg);

			print(`Paths mapped states: ${stateKeys.length} (heuristic expanded ${solved.exploredOrder.length}, maxVisited=${Math.floor(maxVisited)})`);
			for (let i = 0; i < stateKeys.length; i += 1) {
				print(`  [${i}] ${stateKeys[i]}`);
			}
			print(`Top ${topKeys.length} simplified states:`);
			for (let i = 0; i < topKeys.length; i += 1) {
				print(`  #${i + 1} ${topKeys[i]}`);
			}
		}

		function edgePathToNodePath(startKey, edgePath) {
			const nodePath = [{ key: startKey, reason: null }];
			for (const edge of edgePath) {
				nodePath.push({ key: edge.to, reason: edge.reason });
			}
			return nodePath;
		}

		function printWalkPath(path) {
			const steps = path.length - 1;
			print(`Shortest path (${steps} step${steps === 1 ? "" : "s"}):`
				, steps === 0 ? "info" : "ok");
			for (let i = 0; i < path.length; i++) {
				const { key, reason } = path[i];
				const label = i === 0 ? `  [start] ${key}` : `  [${i}] ${key}`;
				const suffix = (i > 0 && reason) ? `   ← ${reason}` : "";
				print(label + suffix);
			}
		}

		async function mlTrainOnWalkExample(startTerm) {
			const functionName = startTerm.kind === "func" ? startTerm.name : null;
			if (!functionName) {
				print("ML: start term is not a function application — skipping training.", "info");
				return;
			}
			const populationSize = 6;
			const generations = 4;
			const solveBudget = 700;
			const progress = createAsyncProgressBar(
				`ML walk-train ${functionName}`, populationSize * generations, true
			);
			let bestConfig = state.ml.models[functionName]
				? { ...state.ml.models[functionName].config }
				: { ...heuristicConfig };
			let bestScore = Number.POSITIVE_INFINITY;
			let done = 0;
			for (let gen = 0; gen < generations; gen += 1) {
				if (progress.isCanceled()) break;
				const population = [
					{ config: { ...bestConfig }, score: Number.POSITIVE_INFINITY }
				];
				for (let i = 1; i < populationSize; i += 1) {
					population.push({
						config: mutateHeuristicConfig(bestConfig, 1 + gen * 0.2),
						score: Number.POSITIVE_INFINITY
					});
				}
				for (const candidate of population) {
					if (progress.isCanceled()) break;
					const solved = await solveByStateWalk(cloneTerm(startTerm), solveBudget, {
						configOverride: candidate.config,
						progressEvery: 18,
						isCanceled: progress.isCanceled
					});
					candidate.score = scoreSolveOutcome(solved);
					done++;
					progress.update(
						done, populationSize * generations,
						`ML walk-train ${functionName}: gen ${gen + 1}/${generations}`
					);
					await sleepFrame();
				}
				population.sort((a, b) => a.score - b.score);
				if (population[0].score < bestScore) {
					bestScore = population[0].score;
					bestConfig = { ...population[0].config };
				}
			}
			if (progress.isCanceled()) {
				progress.finish(`ML walk-training canceled for ${functionName}.`, "#ffb36b");
				return;
			}
			state.ml.models[functionName] = {
				config: { ...bestConfig },
				score: bestScore,
				trainedAt: new Date().toISOString()
			};
			progress.finish(
				`ML walk-trained ${functionName}. score=${bestScore.toFixed(4)}`, "#7eb8ff"
			);
			print(`ML model updated for ${functionName} from walk path.`);
		}

		async function finishWalk(label, bestKey, bestH, exploredSize, edgePath, startKey, resultTerm, startTerm) {
			const normalized = resultTerm ? normalizeSuccessorNumerals(resultTerm) : null;
			print(`${label}: ${bestKey} (h=${bestH})`);
			if (normalized && resultTerm && !isEqual(resultTerm, normalized)) {
				print(`  Normalized: ${termToString(normalized)}`);
			}
			print(`Walk explored ${exploredSize} state${exploredSize === 1 ? "" : "s"} total.`);
			if (debugGraph.truncated) {
				print(`  (graph view capped at ${debugGraph.maxLiveNodes} nodes; the search itself was not limited)`);
			}
			printWalkPath(edgePathToNodePath(startKey, edgePath));
			if (state.ml.enabled) {
				print("ML is on — training on walk path...");
				await mlTrainOnWalkExample(startTerm);
			}
		}

		// `walk` maps the whole reachable state space, breadth-first — it is NOT the
		// goal-directed search that evaluate/debug/bake use. It shares their engine
		// (and its neighbor cache), but runs it in exhaustive mode: no tolerance gate,
		// depth-ordered frontier, and it keeps going after finding a solution, leaving
		// the decision to stop with the operator via the halt/continue prompt.
		async function runWalkCommand(delayMsText, expressionText) {
			const delayMs = Number(delayMsText);
			if (!Number.isFinite(delayMs) || delayMs < 0) {
				print("Usage: walk [delayMs>=0] [expression]", "err");
				return;
			}
			if (walkRuntime.active) {
				print("A walk is already running. Use 'stop' first.", "err");
				return;
			}

			walkRuntime.active = true;
			walkRuntime.stopRequested = false;
			walkRuntime.pendingDecisionResolve = null;

			try {
				const { expressionText: exprOnly, targetFunctions } = parseExpressionWithTarget(expressionText);
				const parsed = parseExpression(exprOnly);
				const start = cloneTerm(parsed);
				const startKey = termToString(start);
				const cfg = getEffectiveHeuristicConfig(parsed, null, targetFunctions);
				const startH = termHeuristic(start, cfg);

				showDebugGraph(
					{ exploredOrder: [startKey], edges: [], path: [] },
					[startKey],
					new Map([[startKey, start]]),
					cfg
				);
				const targetNote = targetFunctions ? `, target=${[...targetFunctions].join(",")}` : "";
				print(`Walk started: ${startKey} (h=${startH}, delay=${Math.floor(delayMs)}ms${targetNote})`);

				let round = 0;
				const solved = await solveByStateWalk(parsed, Number.POSITIVE_INFINITY, {
					interactive: true,
					exhaustive: true,
					stepDelayMs: delayMs,
					progressEvery: 1,
					liveGraph: true,
					targetFunctions,
					onEdge: (fromKey, toKey, toTerm, reason) => appendDebugGraphState(fromKey, toKey, toTerm, reason),
					onNewBest: async (bestKey, bestH) => {
						round += 1;
						const action = await promptWalkDecision(bestKey, round, bestH);
						if (action === "continue") print("Walk continuing...");
						return action;
					},
					isCanceled: () => walkRuntime.stopRequested
				});

				const label = solved.halted
					? "Walk halted — simplest found"
					: walkRuntime.stopRequested
						? "Walk stopped — best found so far"
						: "Walk complete — best found";

				await finishWalk(label, solved.bestKey, solved.bestH, solved.exploredOrder.length,
					solved.path, startKey, solved.result, start);
			} finally {
				walkRuntime.active = false;
				walkRuntime.pendingDecisionResolve = null;
				walkRuntime.stopRequested = false;
			}
		}

		function normalizeSuccessorNumerals(term) {
			if (term.kind === "num" || term.kind === "var") {
				return cloneTerm(term);
			}

			const normalizedArgs = term.args.map(normalizeSuccessorNumerals);
			const normalized = {
				kind: "func",
				name: term.name,
				args: normalizedArgs
			};

			if (
				normalized.kind === "func" &&
				normalized.name === "S" &&
				normalized.args.length === 1 &&
				normalized.args[0].kind === "num"
			) {
				return {
					kind: "num",
					value: normalized.args[0].value + 1
				};
			}

			return normalized;
		}

		function collectVariableNames(term, out = new Set()) {
			if (term.kind === "var") {
				out.add(term.name);
				return out;
			}
			if (term.kind === "func") {
				for (const arg of term.args) collectVariableNames(arg, out);
			}
			return out;
		}

		function instantiateWithAssignment(term, assignment) {
			if (term.kind === "num") return cloneTerm(term);
			if (term.kind === "var") {
				if (assignment.hasOwnProperty(term.name)) {
					return { kind: "num", value: assignment[term.name] };
				}
				return cloneTerm(term);
			}
			return {
				kind: "func",
				name: term.name,
				args: term.args.map((arg) => instantiateWithAssignment(arg, assignment))
			};
		}

		function buildEvaluateAssignments(varNames, bound) {
			const assignments = [];
			const options = [];
			for (let n = 0; n <= bound; n += 1) options.push(n);
			options.push(null);

			function walk(idx, assignment, replacedCount, unboundCount) {
				if (idx === varNames.length) {
					if (replacedCount > 0 && unboundCount > 0) assignments.push({ ...assignment });
					return;
				}
				const name = varNames[idx];
				for (const value of options) {
					if (value === null) {
						walk(idx + 1, assignment, replacedCount, unboundCount + 1);
					} else {
						assignment[name] = value;
						walk(idx + 1, assignment, replacedCount + 1, unboundCount);
						delete assignment[name];
					}
				}
			}

			walk(0, {}, 0, 0);
			return assignments;
		}

		function addDiscoveredAxiom(lhs, rhs, meta = {}) {
			for (const rule of state.rules) {
				if (isEqual(rule.lhs, lhs) && isEqual(rule.rhs, rhs)) {
					return { added: false, source: `${termToString(lhs)}=${termToString(rhs)}` };
				}
			}
			const source = `${termToString(lhs)}=${termToString(rhs)}`;
			state.rules.push({ lhs: cloneTerm(lhs), rhs: cloneTerm(rhs), source, discovered: true, ...meta });
			invalidateRewriteCache();
			collectFunctionNames(lhs, state.knownFunctions);
			collectFunctionNames(rhs, state.knownFunctions);
			return { added: true, source };
		}

		async function evaluateAndDiscover(bound, source, options = {}) {
			const debug = Boolean(options.debug);
			const parsed = parseExpression(source);
			const variables = [...collectVariableNames(parsed)].sort();
			if (variables.length === 0) {
				print("evaluate expects an expression with variables.", "err");
				return { found: [], tested: 0 };
			}

			const assignments = buildEvaluateAssignments(variables, bound);
			const found = [];
			let tested = 0;
			const solveBudget = 1200;
			for (const assignment of assignments) {
				const lhs = instantiateWithAssignment(parsed, assignment);
				const solved = await solveByStateWalk(lhs, solveBudget, { progressEvery: 20 });
				tested += 1;
				if (!solved || !solved.result) continue;
				const rhs = normalizeSuccessorNumerals(solved.result);
				maybeAutoBake(lhs, solved.result);
				if (isEqual(lhs, rhs)) continue;
				const add = addDiscoveredAxiom(lhs, rhs, {
					discovery: "evaluate",
					bound,
					template: termToString(parsed)
				});
				if (add.added) {
					found.push(add.source);
					if (debug) print(`  learned: ${add.source}`);
				}
				if (tested % 6 === 0) await sleepFrame();
			}

			if (
				parsed.kind === "func" &&
				parsed.args.length === 2 &&
				parsed.args[0].kind === "var" &&
				parsed.args[1].kind === "var" &&
				parsed.args[0].name !== parsed.args[1].name
			) {
				const xName = parsed.args[0].name;
				const yName = parsed.args[1].name;
				let commutativeOnBound = true;
				for (let a = 0; a <= bound && commutativeOnBound; a += 1) {
					for (let b = 0; b <= bound; b += 1) {
						const left = instantiateWithAssignment(parsed, { [xName]: a, [yName]: b });
						const right = instantiateWithAssignment(parsed, { [xName]: b, [yName]: a });
						const solvedLeft = await solveByStateWalk(left, solveBudget, { progressEvery: 20 });
						const solvedRight = await solveByStateWalk(right, solveBudget, { progressEvery: 20 });
						tested += 2;
						if (!solvedLeft || !solvedRight || !solvedLeft.result || !solvedRight.result) {
							commutativeOnBound = false;
							break;
						}
						const nLeft = normalizeSuccessorNumerals(solvedLeft.result);
						const nRight = normalizeSuccessorNumerals(solvedRight.result);
						if (!isEqual(nLeft, nRight)) {
							commutativeOnBound = false;
							break;
						}
						if (tested % 6 === 0) await sleepFrame();
					}
				}
				if (commutativeOnBound) {
					const commLhs = cloneTerm(parsed);
					const commRhs = {
						kind: "func",
						name: parsed.name,
						args: [cloneTerm(parsed.args[1]), cloneTerm(parsed.args[0])]
					};
					const add = addDiscoveredAxiom(commLhs, commRhs, {
						discovery: "evaluate-commutativity",
						bound,
						template: termToString(parsed)
					});
					if (add.added) {
						found.push(add.source);
						if (debug) print(`  learned: ${add.source}`);
					}
				}
			}

			return { found, tested, template: termToString(parsed) };
		}



		function addRule(source) {
			const { lhs, rhs } = parseEquation(source);
			state.rules.push({ lhs, rhs, source });
			invalidateRewriteCache();

			const before = new Set(state.knownFunctions);
			collectFunctionNames(lhs, state.knownFunctions);
			collectFunctionNames(rhs, state.knownFunctions);

			const newFns = [...state.knownFunctions].filter((name) => !before.has(name) && name !== "S");
			if (newFns.length === 1) {
				print(`${newFns[0]} defined.`);
			} else if (newFns.length > 1) {
				print(`${newFns.join(", ")} defined.`);
			} else {
				print("Rule added.");
			}
		}

		function removeFunction(name) {
			if (!name) {
				print("Usage: rm [name]", "err");
				return;
			}
			if (name === "S") {
				print("Cannot remove built-in S.", "err");
				return;
			}
			const before = state.rules.length;
			state.rules = state.rules.filter((r) => {
				const used = new Set();
				collectFunctionNames(r.lhs, used);
				collectFunctionNames(r.rhs, used);
				return !used.has(name);
			});
			const removed = before - state.rules.length;
			const wasExistential = name in state.existentials;
			if (removed === 0 && !wasExistential && !state.knownFunctions.has(name)) {
				print(`${name} not found.`);
				return;
			}
			state.knownFunctions.delete(name);
			delete state.existentials[name];
			delete state.algebraic[name];
			invalidateRewriteCache();
			const parts = [];
			if (removed > 0) parts.push(`${removed} rule${removed === 1 ? "" : "s"}`);
			if (wasExistential) parts.push("existential declaration");
			print(`${name} removed (${parts.join(", ") || "no rules"}).`);
		}

		function listFunctions(name) {
			function existentialTag(n) {
				const parts = [];
				const arity = state.existentials[n];
				if (arity === 0) parts.push("existential constant");
				else if (arity !== undefined) parts.push(`existential arity ${arity}`);
				const algebra = describeAlgebraic(state.algebraic[n]);
				if (algebra) parts.push(algebra);
				return parts.length > 0 ? `  [${parts.join("; ")}]` : "";
			}

			if (name) {
				// Show rules involving this function
				const rules = state.rules.filter((r) => {
					const fns = new Set();
					collectFunctionNames(r.lhs, fns);
					collectFunctionNames(r.rhs, fns);
					return fns.has(name);
				});
				if (!state.knownFunctions.has(name) && rules.length === 0) {
					print(`${name}: not defined.`, "err");
					return;
				}
				print(`${name}${existentialTag(name)}`);
				if (rules.length === 0) {
					print("  (no rules)");
				} else {
					for (const r of rules) print(`  ${r.source}${r.inferred ? "  [inferred]" : ""}${r.theorem ? "  [theorem]" : ""}`);
				}
				return;
			}
			// No argument: list all functions
			const names = [...state.knownFunctions].sort();
			if (names.length === 0) {
				print("No functions.");
				return;
			}
			for (const n of names) {
				print(`${n}${existentialTag(n)}`);
			}
		}

		async function bakeFunctionRange(argsRaw) {
			const parts = argsRaw.trim().split(/\s+/);
			if (parts.length < 3 || (parts.length - 1) % 2 !== 0) {
				print("Usage: bake [func] [lo hi] [lo hi] ...", "err");
				return;
			}
			const funcName = parts[0];
			const ranges = [];
			for (let i = 1; i < parts.length; i += 2) {
				const lo = parseInt(parts[i], 10);
				const hi = parseInt(parts[i + 1], 10);
				if (isNaN(lo) || isNaN(hi) || lo > hi) {
					print(`Invalid range: ${parts[i]} ${parts[i + 1]}`, "err");
					return;
				}
				ranges.push([lo, hi]);
			}

			if (!state.baked[funcName]) state.baked[funcName] = {};
			const cache = state.baked[funcName];

			const allKeys = [];
			function collectKeys(depth, current) {
				if (depth === ranges.length) {
					allKeys.push(current.slice());
					return;
				}
				const [lo, hi] = ranges[depth];
				for (let v = lo; v <= hi; v++) {
					current.push(v);
					collectKeys(depth + 1, current);
					current.pop();
				}
			}
			collectKeys(0, []);

			const total = allKeys.length;
			const rangeStr = ranges.map(([lo, hi]) => `${lo}-${hi}`).join(" x ");

			const progressEl = document.createElement("div");
			progressEl.className = "bake-progress";
			progressEl.innerHTML =
				`<div class="bake-head"><span class="bake-label">Baking ${funcName} over ${rangeStr}: <span class="bake-count">0</span>/${total}</span><button class="bake-cancel" type="button" title="Cancel bake">×</button></div>` +
				`<div class="bake-bar-track"><div class="bake-bar-fill" style="width:0%"></div></div>`;
			output.appendChild(progressEl);
			output.scrollTop = output.scrollHeight;

			const labelCount = progressEl.querySelector(".bake-count");
			const labelText = progressEl.querySelector(".bake-label");
			const barFill = progressEl.querySelector(".bake-bar-fill");
			const cancelBtn = progressEl.querySelector(".bake-cancel");

			let canceled = false;
			cancelBtn.addEventListener("click", () => {
				canceled = true;
				cancelBtn.disabled = true;
				cancelBtn.textContent = "…";
			});

			function isUnresolvedValue(value, callStr) {
				if (typeof value !== "string") return false;
				if (value === callStr) return true;
				return value.includes(`${funcName}(`);
			}

			async function tryBakeKey(current) {
				const key = current.join(",");
				const callStr = `${funcName}(${current.join(",")})`;
				const existing = cache[key];
				if (existing !== undefined && !isUnresolvedValue(existing, callStr)) {
					return { status: "already", key, callStr };
				}

				try {
					const parsed = parseExpression(callStr);
					const solved = await solveByStateWalk(parsed, 2500, {
						progressEvery: 14
					});
					const normalized = normalizeSuccessorNumerals(solved.result);
					const out = termToString(normalized);
					if (!isUnresolvedValue(out, callStr)) {
						cache[key] = out;
						invalidateRewriteCache();
						return { status: "resolved", key, callStr, value: out };
					}
				} catch {}

				return { status: "pending", key, callStr };
			}

			try {
				const YIELD_EVERY = 8;
				let done = 0;
				let skipped = 0;
				let resolvedNow = 0;
				let pending = [];

				for (let idx = 0; idx < allKeys.length; idx++) {
					if (canceled) break;
					const current = allKeys[idx];
					const verdict = await tryBakeKey(current);
					if (verdict.status === "already") {
						skipped++;
					} else if (verdict.status === "resolved") {
						resolvedNow++;
					} else {
						pending.push(current);
					}

					done++;
					if (done % YIELD_EVERY === 0 || done === total) {
						const pct = Math.round((done / total) * 100);
						labelCount.textContent = done;
						barFill.style.width = `${pct}%`;
						output.scrollTop = output.scrollHeight;
						await new Promise((r) => setTimeout(r, 0));
					}
				}

				labelCount.textContent = total;
				barFill.style.width = "100%";
				let pass = 0;
				while (!canceled && pending.length > 0) {
					pass++;
					let progressed = 0;
					const nextPending = [];
					for (let i = 0; i < pending.length; i++) {
						if (canceled) break;
						const current = pending[i];
						const verdict = await tryBakeKey(current);
						if (verdict.status === "resolved" || verdict.status === "already") {
							progressed++;
							if (verdict.status === "resolved") resolvedNow++;
						} else {
							nextPending.push(current);
						}

						if (i % YIELD_EVERY === 0 || i === pending.length - 1) {
							labelText.textContent = `Baking ${funcName} over ${rangeStr}: ${total}/${total} (retry ${pass}, pending ${nextPending.length + (pending.length - i - 1)})`;
							output.scrollTop = output.scrollHeight;
							await new Promise((r) => setTimeout(r, 0));
						}
					}

					pending = nextPending;
					if (progressed === 0) break;
				}

				const unresolved = pending.length;
				const totalCount = Object.keys(cache).length;
				if (canceled) {
					progressEl.innerHTML = `<span style="color:#ffb36b">Canceled. ${funcName} baked over ${rangeStr}: ${resolvedNow} new, ${totalCount} total, ${unresolved} unresolved.</span>`;
				} else {
					progressEl.innerHTML = `<span style="color:#7eb8ff">Done. ${funcName} baked over ${rangeStr}: ${resolvedNow} new, ${totalCount} total${unresolved > 0 ? `, ${unresolved} unresolved` : ""}.</span>`;
				}
			} finally {
				output.scrollTop = output.scrollHeight;
			}
		}

		function listBaked() {
			const names = Object.keys(state.baked).sort();
			if (names.length === 0) {
				print("No baked functions.");
				return;
			}
			for (const name of names) {
				const count = Object.keys(state.baked[name]).length;
				print(`${name}: ${count} entr${count === 1 ? "y" : "ies"}`);
			}
		}

		function removeBake(name) {
			if (!name) {
				print("Usage: rm bake [name]", "err");
				return;
			}
			if (state.baked[name]) {
				const count = Object.keys(state.baked[name]).length;
				delete state.baked[name];
				invalidateRewriteCache();
				print(`${name} bake removed (${count} entr${count === 1 ? "y" : "ies"}).`);
			} else {
				print(`No baked data for ${name}.`);
			}
		}

		function exportState() {
			const payload = {
				version: 1,
				rules: state.rules.map((r) => r.source),
				baked: state.baked,
				existentials: state.existentials,
				algebraic: state.algebraic,
				narrow: { ...state.narrow },
				autobake: state.autobake,
				ranker: { ...state.ml.ranker, weights: { ...state.ml.ranker.weights } }
			};
			const json = JSON.stringify(payload, null, 2);
			const blob = new Blob([json], { type: "application/json" });
			const url = URL.createObjectURL(blob);
			const stamp = new Date().toISOString().replace(/[:.]/g, "-");
			const link = document.createElement("a");
			link.href = url;
			link.download = `aximalpha-state-${stamp}.json`;
			document.body.appendChild(link);
			link.click();
			link.remove();
			setTimeout(() => URL.revokeObjectURL(url), 1500);
			print(`Exported JSON file: ${link.download}`);
		}

		function applyImportedState(data) {
			if (!data || !Array.isArray(data.rules)) {
				print("JSON must contain { rules: [...] }.", "err");
				return;
			}

			state.rules = [];
			state.knownFunctions = new Set(["S"]);
			state.baked = {};
			state.existentials = {};
			state.algebraic = {};
			invalidateRewriteCache();

			// Existentials must be known BEFORE rules are parsed: a zero-arity one
			// changes how a bare identifier reads, so parsing first would bake the old
			// variable interpretation into every rule.
			if (data.existentials && typeof data.existentials === "object") {
				for (const [name, arity] of Object.entries(data.existentials)) {
					const a = Number(arity);
					if (Number.isInteger(a) && a >= 0) {
						state.existentials[name] = a;
						state.knownFunctions.add(name);
					}
				}
			}

			for (const source of data.rules) {
				try {
					const parsed = parseEquation(source);
					state.rules.push({ ...parsed, source });
					collectFunctionNames(parsed.lhs, state.knownFunctions);
					collectFunctionNames(parsed.rhs, state.knownFunctions);
				} catch (e) {
					print(`Skipped invalid rule: ${source}`, "err");
				}
			}
			if (data.baked && typeof data.baked === "object") {
				for (const [name, entries] of Object.entries(data.baked)) {
					if (typeof entries === "object") {
						state.baked[name] = { ...entries };
					}
				}
				const bakedCount = Object.keys(state.baked).length;
				if (bakedCount > 0) print(`Restored baked data for: ${Object.keys(state.baked).join(", ")}`);
			}
			if (data.existentials && typeof data.existentials === "object") {
				for (const [name, arity] of Object.entries(data.existentials)) {
					const a = Number(arity);
					if (Number.isInteger(a) && a >= 0) {
						state.existentials[name] = a;
						state.knownFunctions.add(name);
					}
				}
				const exCount = Object.keys(state.existentials).length;
				if (exCount > 0) print(`Restored existentials: ${Object.keys(state.existentials).join(", ")}`);
			}
			if (data.algebraic && typeof data.algebraic === "object") {
				for (const [name, props] of Object.entries(data.algebraic)) {
					if (!props || typeof props !== "object") continue;
					state.algebraic[name] = { assoc: Boolean(props.assoc), comm: Boolean(props.comm) };
					state.knownFunctions.add(name);
				}
				const names = Object.keys(state.algebraic);
				if (names.length > 0) print(`Restored algebraic laws for: ${names.join(", ")}`);
			}
			if (data.narrow && typeof data.narrow === "object") {
				if (typeof data.narrow.enabled === "boolean") state.narrow.enabled = data.narrow.enabled;
				const bound = Number(data.narrow.numeralBound);
				if (Number.isInteger(bound) && bound >= 0) state.narrow.numeralBound = bound;
				const cap = Number(data.narrow.maxInstantiations);
				if (Number.isInteger(cap) && cap >= 1) state.narrow.maxInstantiations = cap;
				const rounds = Number(data.narrow.zigzagRounds);
				if (Number.isInteger(rounds) && rounds >= 1) state.narrow.zigzagRounds = rounds;
				const width = Number(data.narrow.zagWidth);
				if (Number.isInteger(width) && width >= 1) state.narrow.zagWidth = width;
				print(`Restored narrow: ${state.narrow.enabled ? `on, numerals 0..${state.narrow.numeralBound}` : "off"}`);
			}
			if (data.ranker && typeof data.ranker === "object") {
				const r = state.ml.ranker;
				if (data.ranker.weights && typeof data.ranker.weights === "object") {
					r.weights = { ...data.ranker.weights };
				}
				if (typeof data.ranker.learn === "boolean") r.learn = data.ranker.learn;
				if (typeof data.ranker.rank === "boolean") r.rank = data.ranker.rank;
				if (Number.isFinite(data.ranker.examples)) r.examples = data.ranker.examples;
				if (Number.isFinite(data.ranker.solves)) r.solves = data.ranker.solves;
				const n = Object.keys(r.weights).length;
				if (n > 0) print(`Restored edge ranker: ${n} weights from ${r.solves} solve(s)`);
			}
			if (typeof data.autobake === "boolean") {
				state.autobake = data.autobake;
				print(`Restored autobake: ${state.autobake ? "on" : "off"}`);
			}
			print(`Imported ${state.rules.length} rule${state.rules.length === 1 ? "" : "s"}.`);
		}

		function importState() {
			const picker = document.createElement("input");
			picker.type = "file";
			picker.accept = ".json,application/json";
			picker.addEventListener("change", async () => {
				const file = picker.files && picker.files[0];
				if (!file) return;
				let data;
				try {
					const raw = await file.text();
					data = JSON.parse(raw);
				} catch {
					print("Invalid JSON file.", "err");
					return;
				}
				applyImportedState(data);
			});
			picker.click();
		}

		async function solveWithProgress(parsed, maxVisited, options = {}) {
			const label = options.label || `Solving ${termToString(parsed)}`;
			const progress = createAsyncProgressBar(label, maxVisited, Boolean(options.cancellable));
			const solved = await solveByStateWalk(parsed, maxVisited, {
				collectDebug: Boolean(options.collectDebug),
				maxDebugSteps: options.maxDebugSteps,
				maxDebugNeighborSamples: options.maxDebugNeighborSamples,
				targetFunctions: options.targetFunctions || null,
				isCanceled: progress.isCanceled,
				onProgress: (p) => {
					progress.update(p.explored, p.maxVisited, `${label}: ${p.explored}/${p.maxVisited} (bestH=${p.bestH}, q=${p.queueSize})`);
				},
				progressEvery: 10
			});
			if (progress.isCanceled()) {
				progress.finish(`Canceled: ${label}`, "#ffb36b");
				return null;
			}
			progress.finish(`Done: ${label} (${solved.exploredOrder.length} explored)`, "#7eb8ff");
			return solved;
		}

		async function evaluateExpression(source) {
			const { expressionText, targetFunctions } = parseExpressionWithTarget(source);
			const parsed = parseExpression(expressionText);
			const solved = await solveWithProgress(parsed, 2500, {
				label: `Eval ${termToString(parsed)}`,
				cancellable: true,
				targetFunctions
			});
			if (!solved) return;
			const normalizedResult = normalizeSuccessorNumerals(solved.result);
			print(termToString(normalizedResult));
			const learned = maybeAutoBake(parsed, solved.result);
			if (learned) print(`  autobaked ${learned}`);
		}

		function getFunctionArities(functionName) {
			const arities = new Set();
			for (const rule of state.rules) {
				const collectArities = (term) => {
					if (term.kind === "func" && term.name === functionName) {
						arities.add(term.args.length);
					}
					if (term.kind === "func") {
						for (const arg of term.args) collectArities(arg);
					}
				};
				collectArities(rule.lhs);
				collectArities(rule.rhs);
			}
			return arities.size > 0 ? [...arities].sort((a, b) => a - b) : [1, 2];
		}

		function buildTemplatesForFunction(functionName) {
			const arities = getFunctionArities(functionName);
			const templates = [];
			for (const arity of arities) {
				const varChars = "xyzwuvs".split("").slice(0, arity);
				const templateStr = `${functionName}(${varChars.join(",")})`;
				templates.push(templateStr);
			}
			return templates;
		}

		async function runEvaluateCommand(boundText, expressionText) {
			const bound = Number(boundText);
			if (!Number.isFinite(bound) || bound < 0 || !Number.isInteger(bound)) {
				print("Usage: evaluate [bound>=0 integer] [expression]", "err");
				return;
			}
			let templates = [];
			if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(expressionText.trim())) {
				const funcName = expressionText.trim();
				if (!state.knownFunctions.has(funcName)) {
					print(`Function '${funcName}' not defined.`, "err");
					return;
				}
				templates = buildTemplatesForFunction(funcName);
			} else {
				templates = [expressionText.trim()];
			}

			for (const template of templates) {
				const result = await evaluateAndDiscover(bound, template, { debug: false });
				if (!result) continue;
				print(`Evaluate tested ${result.tested} case${result.tested === 1 ? "" : "s"} for ${result.template}.`);
				if (result.found.length === 0) {
					print("  No new axioms discovered.");
					continue;
				}
				print(`  Discovered ${result.found.length} new axiom${result.found.length === 1 ? "" : "s"}:`);
				for (const source of result.found) print(`    ${source}`);
			}
		}

		async function debugEvaluateCommand(boundText, expressionText) {
			const bound = Number(boundText);
			if (!Number.isFinite(bound) || bound < 0 || !Number.isInteger(bound)) {
				print("Usage: debug evaluate [bound>=0 integer] [expression]", "err");
				return;
			}
			let templates = [];
			if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(expressionText.trim())) {
				const funcName = expressionText.trim();
				if (!state.knownFunctions.has(funcName)) {
					print(`Function '${funcName}' not defined.`, "err");
					return;
				}
				templates = buildTemplatesForFunction(funcName);
			} else {
				templates = [expressionText.trim()];
			}

			for (const template of templates) {
				print(`Debug evaluate: bound=${bound}, template=${template}`);
				const result = await evaluateAndDiscover(bound, template, { debug: true });
				if (!result) continue;
				print(`  Tested ${result.tested} case${result.tested === 1 ? "" : "s"}.`);
				if (result.found.length === 0) {
					print("  Axioms found: (none)");
					continue;
				}
				print(`  Axioms found (${result.found.length}):`);
				for (const source of result.found) print(`    ${source}`);
			}
		}

		function listHeuristicConfig() {
			print("Heuristic config:");
			for (const [key, value] of Object.entries(heuristicConfig)) {
				print(`  ${key} = ${value}`);
			}
		}

		function setHeuristicConfig(raw) {
			const m = raw.match(/^(\w+)\s+(.+)$/);
			if (!m) {
				print("Usage: heur set [key] [value]", "err");
				return;
			}
			const key = m[1];
			const valRaw = m[2].trim();
			if (!(key in heuristicConfig)) {
				print(`Unknown heuristic key: ${key}`, "err");
				return;
			}

			const num = Number(valRaw);
			if (!Number.isFinite(num)) {
				print(`Invalid numeric value: ${valRaw}`, "err");
				return;
			}

			const bounded01 = new Set(["explorationChance", "alternatePathChance"]);
			if (bounded01.has(key) && (num < 0 || num > 1)) {
				print(`${key} must be in [0,1].`, "err");
				return;
			}

			const integerKeys = new Set(["explorationInterval", "explorationPoolSample", "explorationPoolLimit", "explorationPoolTrimTo"]);
			heuristicConfig[key] = integerKeys.has(key) ? Math.max(0, Math.floor(num)) : num;
			print(`heuristic ${key} = ${heuristicConfig[key]}`);
		}

		function parseExistsSpec(raw) {
			const s = raw.trim();
			// Simple name: "i", "pi", "eps"
			const simple = s.match(/^([A-Za-z_][A-Za-z0-9_]*)$/);
			if (simple) return { name: simple[1], arity: 0 };
			// Name with argument list: "n(x)", "i(x,y)", "n()"
			const withArgs = s.match(/^([A-Za-z_][A-Za-z0-9_]*)\(([^)]*)\)$/);
			if (withArgs) {
				const argStr = withArgs[2].trim();
				const arity = argStr ? argStr.split(",").filter((a) => a.trim()).length : 0;
				return { name: withArgs[1], arity };
			}
			return null;
		}

		// Remember a solved ground call as a baked fact. Only fires for F(nums...) with a
		// fully ground answer — anything with variables left, or that still mentions F,
		// isn't a settled result and would poison the table.
		function maybeAutoBake(sourceTerm, resultTerm) {
			if (!state.autobake) return null;
			if (!sourceTerm || !resultTerm) return null;
			// Store under the canonical form, since that is what lookups will present.
			sourceTerm = canonicalizeTerm(sourceTerm);
			if (sourceTerm.kind !== "func") return null;
			// Any ground argument is bakeable, not just numerals — B(L(0,1))=2 is exactly
			// the kind of fact these derivations are built out of.
			if (collectVariableNames(sourceTerm).size > 0) return null;

			const normalized = canonicalizeTerm(normalizeSuccessorNumerals(resultTerm));
			if (collectVariableNames(normalized).size > 0) return null;
			if (isEqual(sourceTerm, normalized)) return null;

			const text = termToString(normalized);
			if (text.includes(`${sourceTerm.name}(`)) return null;

			const key = bakedKeyForArgs(sourceTerm.args);
			if (!state.baked[sourceTerm.name]) state.baked[sourceTerm.name] = {};
			if (state.baked[sourceTerm.name][key] === text) return null;

			state.baked[sourceTerm.name][key] = text;
			invalidateRewriteCache();
			return `${termToString(sourceTerm)}=${text}`;
		}

		function reparseRulesFromSource() {
			const rebuilt = [];
			for (const rule of state.rules) {
				try {
					const parsed = parseEquation(rule.source);
					rebuilt.push({ ...rule, lhs: parsed.lhs, rhs: parsed.rhs });
				} catch {
					rebuilt.push(rule);
				}
			}
			state.rules = rebuilt;
		}

		function describeAlgebraic(props) {
			if (!props) return "";
			if (props.assoc && props.comm) return "associative, commutative";
			if (props.assoc) return "associative";
			if (props.comm) return "commutative";
			return "";
		}

		// `assoc F` / `comm F` / `ac F` — declare laws so the engine can canonicalise.
		// `assoc F off` (or rm F) clears them.
		function algebraicCommand(kind, raw) {
			const parts = raw.trim().split(/\s+/).filter(Boolean);

			if (parts.length === 0) {
				const names = Object.keys(state.algebraic).sort();
				if (names.length === 0) {
					print("No associative or commutative declarations.");
					return;
				}
				for (const name of names) {
					print(`  ${name}: ${describeAlgebraic(state.algebraic[name])}`);
				}
				return;
			}

			const name = parts[0];
			if (name === "S") {
				print("Cannot declare laws for built-in S.", "err");
				return;
			}

			if (parts[1] === "off") {
				if (!state.algebraic[name]) {
					print(`${name} has no algebraic declaration.`);
					return;
				}
				delete state.algebraic[name];
				invalidateRewriteCache();
				print(`${name}: algebraic laws cleared.`);
				return;
			}

			const props = state.algebraic[name] || { assoc: false, comm: false };
			if (kind === "assoc" || kind === "ac") props.assoc = true;
			if (kind === "comm" || kind === "ac") props.comm = true;
			state.algebraic[name] = props;
			state.knownFunctions.add(name);
			invalidateRewriteCache();
			print(`${name}: ${describeAlgebraic(props)}.`);

			const redundant = state.rules.filter((r) => ruleIsAlgebraicTautology(r));
			if (redundant.length > 0) {
				print(`  ${redundant.length} rule${redundant.length === 1 ? "" : "s"} now redundant and skipped during search:`);
				for (const rule of redundant) print(`    ${rule.source}`);
			}
		}

		function autobakeCommand(raw) {
			const arg = raw.trim().toLowerCase();
			if (!arg) {
				const total = Object.values(state.baked).reduce((n, t) => n + Object.keys(t).length, 0);
				print(`autobake: ${state.autobake ? "on" : "off"} (${total} baked entr${total === 1 ? "y" : "ies"} stored)`);
				return;
			}
			if (arg !== "on" && arg !== "off") {
				print("Usage: autobake | autobake on | autobake off", "err");
				return;
			}
			state.autobake = arg === "on";
			print(state.autobake
				? "autobake on — solved ground expressions are baked automatically."
				: "autobake off.");
		}

		function graphCapCommand(raw) {
			const arg = raw.trim();
			if (!arg) {
				print(`graph cap = ${debugGraph.maxLiveNodes} nodes`);
				return;
			}
			const n = Number(arg);
			if (!Number.isInteger(n) || n < 10) {
				print("Usage: graph cap [n>=10]", "err");
				return;
			}
			debugGraph.maxLiveNodes = n;
			print(`graph cap = ${n} nodes. Only the view is capped, never the walk itself;`);
			print("  the force layout is O(n²) per frame, so large caps render slowly.");
		}

		function narrowCommand(raw) {
			const arg = raw.trim().toLowerCase();

			if (!arg) {
				if (!state.narrow.enabled) {
					print("narrow: off (reverse rules never expand or guess values)");
					return;
				}
				print(`narrow: on, numerals 0..${state.narrow.numeralBound} (plus subterms of the term being rewritten)`);
				print(`  max guesses per rule per position: ${state.narrow.maxInstantiations}`);
				print(`  zig-zag: ${state.narrow.zigzagRounds} rounds, expanding from ${state.narrow.zagWidth} stalled state(s) per zag`);
				return;
			}

			const roundsMatch = arg.match(/^rounds\s+(\d+)$/);
			if (roundsMatch) {
				state.narrow.zigzagRounds = Math.max(1, parseInt(roundsMatch[1], 10));
				print(`narrow rounds = ${state.narrow.zigzagRounds} zig-zag alternations.`);
				return;
			}

			const widthMatch = arg.match(/^width\s+(\d+)$/);
			if (widthMatch) {
				state.narrow.zagWidth = Math.max(1, parseInt(widthMatch[1], 10));
				print(`narrow width = ${state.narrow.zagWidth} stalled state(s) expanded per zag.`);
				return;
			}

			if (arg === "off") {
				state.narrow.enabled = false;
				invalidateRewriteCache();
				print("narrow off — reverse rules are limited to non-expanding, fully-bound rewrites.");
				return;
			}

			if (arg === "on") {
				state.narrow.enabled = true;
				invalidateRewriteCache();
				print(`narrow on — numerals 0..${state.narrow.numeralBound} plus subterms.`);
				return;
			}

			const maxMatch = arg.match(/^max\s+(\d+)$/);
			if (maxMatch) {
				state.narrow.maxInstantiations = Math.max(1, parseInt(maxMatch[1], 10));
				invalidateRewriteCache();
				print(`narrow max = ${state.narrow.maxInstantiations} guesses per rule per position.`);
				return;
			}

			const bound = Number(arg);
			if (!Number.isInteger(bound) || bound < 0) {
				print("Usage: narrow | narrow on | narrow off | narrow [bound>=0] | narrow max [n] | narrow rounds [n] | narrow width [n]", "err");
				return;
			}

			state.narrow.numeralBound = bound;
			state.narrow.enabled = true;
			invalidateRewriteCache();
			print(`narrow on — numerals 0..${bound} plus subterms of the term being rewritten.`);
		}

		function existsCommand(raw) {
			const spec = parseExistsSpec(raw.trim());
			if (!spec) {
				print("Usage: exists name  or  exists name(x,y,...)", "err");
				return;
			}
			const { name, arity } = spec;
			if (name === "S") {
				print("Cannot redefine built-in S.", "err");
				return;
			}
			const already = state.existentials[name];
			state.existentials[name] = arity;
			state.knownFunctions.add(name);
			// Rules typed before the declaration parsed this name as a variable; re-read
			// them from source so it becomes the constant everywhere.
			if (arity === 0) reparseRulesFromSource();
			invalidateRewriteCache();
			if (already !== undefined && already !== arity) {
				print(`${name} redeclared as existential (arity ${arity}).`);
			} else if (arity === 0) {
				print(`${name} declared as existential constant.`);
			} else {
				print(`${name} declared as existential with arity ${arity}.`);
			}
		}

		function parseBoundsSpec(parts, startIdx = 1) {
			if (parts.length < startIdx + 2 || (parts.length - startIdx) % 2 !== 0) {
				return null;
			}
			const ranges = [];
			for (let i = startIdx; i < parts.length; i += 2) {
				const lo = parseInt(parts[i], 10);
				const hi = parseInt(parts[i + 1], 10);
				if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo > hi) return null;
				ranges.push([lo, hi]);
			}
			return ranges;
		}

		function expandRanges(ranges) {
			const out = [];
			function walk(depth, acc) {
				if (depth === ranges.length) {
					out.push(acc.slice());
					return;
				}
				const [lo, hi] = ranges[depth];
				for (let v = lo; v <= hi; v++) {
					acc.push(v);
					walk(depth + 1, acc);
					acc.pop();
				}
			}
			walk(0, []);
			return out;
		}

		function clamp(val, lo, hi) {
			return Math.max(lo, Math.min(hi, val));
		}

		function mutateHeuristicConfig(base, scale = 1) {
			const next = { ...base };
			next.functionWeight = clamp(base.functionWeight + (Math.random() * 4 - 2) * scale, 1, 30);
			next.depthWeight = clamp(base.depthWeight + (Math.random() * 1.5 - 0.75) * scale, 0, 10);
			next.symbolWeight = clamp(base.symbolWeight + (Math.random() * 1.5 - 0.75) * scale, 0, 10);
			next.tolerance = clamp(base.tolerance + (Math.random() * 3 - 1.5) * scale, 0, 30);
			next.explorationInterval = Math.max(0, Math.floor(clamp(base.explorationInterval + (Math.random() * 10 - 5) * scale, 0, 200)));
			next.explorationChance = clamp(base.explorationChance + (Math.random() * 0.18 - 0.09) * scale, 0, 1);
			next.alternatePathChance = clamp(base.alternatePathChance + (Math.random() * 0.18 - 0.09) * scale, 0, 1);
			next.alternatePathToleranceMultiplier = clamp(base.alternatePathToleranceMultiplier + (Math.random() * 1.2 - 0.6) * scale, 1, 10);
			next.successorDetourMultiplier = clamp(base.successorDetourMultiplier + (Math.random() * 2 - 1) * scale, 1, 20);
			next.explorationPoolSample = Math.max(1, Math.floor(clamp(base.explorationPoolSample + (Math.random() * 4 - 2) * scale, 1, 50)));
			next.explorationPoolLimit = Math.max(20, Math.floor(clamp(base.explorationPoolLimit + (Math.random() * 60 - 30) * scale, 20, 1000)));
			next.explorationPoolTrimTo = Math.max(10, Math.floor(clamp(base.explorationPoolTrimTo + (Math.random() * 40 - 20) * scale, 10, next.explorationPoolLimit - 1)));
			return next;
		}

		function scoreSolveOutcome(solved) {
			if (!solved || !solved.result) return 1e9;
			const h = termHeuristic(solved.result, heuristicConfig);
			const pathPenalty = solved.path ? solved.path.length * 0.7 : 0;
			const exploredPenalty = solved.exploredOrder ? solved.exploredOrder.length * 0.04 : 0;
			return h + pathPenalty + exploredPenalty;
		}

		async function mlTrainFunction(argsRaw) {
			const parts = argsRaw.trim().split(/\s+/).filter(Boolean);
			if (parts.length < 3) {
				print("Usage: ml train [function] [lo hi] [lo hi] ...", "err");
				return;
			}
			const functionName = parts[0];
			const ranges = parseBoundsSpec(parts, 1);
			if (!ranges) {
				print("Usage: ml train [function] [lo hi] [lo hi] ...", "err");
				return;
			}

			const combos = expandRanges(ranges);
			if (combos.length === 0) {
				print("No training samples generated.", "err");
				return;
			}

			const MAX_TRAIN_SAMPLES = 48;
			const trainSet = combos.slice(0, MAX_TRAIN_SAMPLES);
			const populationSize = 8;
			const generations = 6;
			const solveBudget = 700;

			const progress = createAsyncProgressBar(`ML training ${functionName}`, populationSize * generations * trainSet.length, true);
			let bestConfig = { ...heuristicConfig };
				let bestScore = Number.POSITIVE_INFINITY;
				let done = 0;

				for (let gen = 0; gen < generations; gen += 1) {
					if (progress.isCanceled()) break;
					const population = [];
					population.push({ config: { ...bestConfig }, score: Number.POSITIVE_INFINITY });
					for (let i = 1; i < populationSize; i += 1) {
						population.push({ config: mutateHeuristicConfig(bestConfig, 1 + gen * 0.2), score: Number.POSITIVE_INFINITY });
					}

					for (const candidate of population) {
						if (progress.isCanceled()) break;
						let totalScore = 0;
						for (let i = 0; i < trainSet.length; i += 1) {
							if (progress.isCanceled()) break;
							const args = trainSet[i];
							const expr = parseExpression(`${functionName}(${args.join(",")})`);
							const solved = await solveByStateWalk(expr, solveBudget, {
								configOverride: candidate.config,
								progressEvery: 18,
								isCanceled: progress.isCanceled
							});
							totalScore += scoreSolveOutcome(solved);
							done++;
							if (done % 2 === 0 || done === populationSize * generations * trainSet.length) {
								progress.update(done, populationSize * generations * trainSet.length, `ML training ${functionName}: gen ${gen + 1}/${generations}`);
								await sleepFrame();
							}
						}
						candidate.score = totalScore / trainSet.length;
					}

					population.sort((a, b) => a.score - b.score);
					if (population[0].score < bestScore) {
						bestScore = population[0].score;
						bestConfig = { ...population[0].config };
					}
				}

				if (progress.isCanceled()) {
					progress.finish(`ML training canceled for ${functionName}.`, "#ffb36b");
					return;
				}

				state.ml.models[functionName] = {
					config: { ...bestConfig },
					bounds: ranges,
					score: bestScore,
					trainedAt: new Date().toISOString()
				};
				progress.finish(`ML trained ${functionName}. score=${bestScore.toFixed(4)} (samples=${trainSet.length})`, "#7eb8ff");
				print(`ML model ready for ${functionName}. Use 'ml on' to enable.`);
		}

		async function debugExpression(source) {
			const { expressionText, targetFunctions } = parseExpressionWithTarget(source);
			const parsed = parseExpression(expressionText);
			const cfg = getEffectiveHeuristicConfig(parsed, null, targetFunctions);
			const solved = await solveWithProgress(parsed, 2500, {
				label: `Debug ${termToString(parsed)}`,
				cancellable: true,
				collectDebug: true,
				maxDebugSteps: 40,
				maxDebugNeighborSamples: 16,
				targetFunctions
			});
			if (!solved) return;
			const normalizedResult = normalizeSuccessorNumerals(solved.result);
			const topCount = getTopHighlightCount();
			const termsByKey = new Map();
			for (const key of solved.exploredOrder) {
				try {
					termsByKey.set(key, parseExpression(key));
				} catch {}
			}
			const topKeys = computeTopSimplifiedKeys(solved.exploredOrder, termsByKey, topCount, cfg);
			showDebugGraph(solved, topKeys, termsByKey, cfg);
			print(`States explored: ${solved.exploredOrder.length}`);
			if (solved.phases && solved.phases.length > 1) {
				const breakdown = solved.phases.map((p) => `${p.label} ${p.explored} (bestH=${p.bestH})`).join(", ");
				print(`  phases: ${breakdown}`);
			}
			if (solved.path.length === 0) {
				print("Path: (no rewrites)");
			} else {
				print("Path to result:");
				for (const step of solved.path) {
					print(`  ${step.from} -> ${step.to}  via ${step.reason}`);
				}
			}
			print(`Result: ${termToString(solved.result)}`);
			if (!isEqual(normalizedResult, solved.result)) {
				print(`Normalized: ${termToString(normalizedResult)}`);
			}
			const learnedFromDebug = maybeAutoBake(parsed, solved.result);
			if (learnedFromDebug) print(`Autobaked ${learnedFromDebug}`);

			if (solved.debug) {
				print("Heuristic debug:");
				print(`  start h=${solved.debug.startH}, best h=${solved.debug.bestH}, enqueued=${solved.debug.enqueued}`);
				print(`  skips: visited=${solved.debug.visitedSkips}, worse-g=${solved.debug.worseGSkips}, gated=${solved.debug.gateSkips}`);
				const depList = solved.debug.successorDependentFunctions.length > 0
					? solved.debug.successorDependentFunctions.join(", ")
					: "(none)";
				print(`  successor-dependent functions: ${depList}`);
				print(`  target: ${solved.debug.targetFunctions.length > 0 ? solved.debug.targetFunctions.join(", ") : "(none — minimizing toward a numeral/existential)"}`);
				for (let i = 0; i < solved.debug.steps.length; i += 1) {
					const step = solved.debug.steps[i];
					print(`  step ${i}: ${step.state}`);
					print(`    g=${step.g}, h=${step.h}, bestH ${step.bestHBefore} -> ${step.bestHAfter}, neighbors=${step.neighborsGenerated}`);
					print(`    enq=${step.enqueued}, reject visited=${step.rejectedVisited}, worse-g=${step.rejectedWorseG}, gated=${step.rejectedGate}`);
					for (const sample of step.samples) {
						print(`    ${sample}`);
					}
				}
			}
		}

		async function debugInput(source) {
			const evalMatch = source.match(/^evaluate\s+(\d+)\s+(.+)$/i);
			if (evalMatch) {
				await debugEvaluateCommand(evalMatch[1], evalMatch[2]);
				return;
			}
			await debugExpression(source);
		}

		async function handleCommand(raw) {
			const line = raw.trim();
			if (!line) return;

			print(`> ${line}`, "cmd");
			const lower = line.toLowerCase();

			if (lower === "clear") {
				output.innerHTML = "";
				return;
			}
			if (lower === "debug off") {
				hideDebugGraph();
				print("Debug graph hidden.");
				return;
			}
			if (lower === "stop") {
				if (!walkRuntime.active) {
					print("No active walk to stop.");
					return;
				}
				walkRuntime.stopRequested = true;
				if (typeof walkRuntime.pendingDecisionResolve === "function") {
					walkRuntime.pendingDecisionResolve("halt");
				}
				print("Stop requested for active walk.");
				return;
			}
			if (lower === "ls bake") {
				listBaked();
				return;
			}
			if (lower === "ls" || lower.startsWith("ls ")) {
				const arg = line.slice(2).trim();
				listFunctions(arg || undefined);
				return;
			}
			if (lower.startsWith("rm bake ")) {
				removeBake(line.slice(8).trim());
				return;
			}
			if (lower.startsWith("rm ")) {
				removeFunction(line.slice(3).trim());
				return;
			}
			if (lower.startsWith("bake ")) {
				bakeFunctionRange(line.slice(5).trim()).catch((e) => {
					print(e.message || "Bake error", "err");
				});
				return;
			}
			if (lower === "export") {
				exportState();
				return;
			}
			if (lower === "import") {
				importState();
				return;
			}
			if (lower.startsWith("debug ")) {
				try {
					await debugInput(line.slice(6).trim());
				} catch (e) {
					print(e.message || "Error", "err");
				}
				return;
			}
			if (lower === "heur" || lower === "heur ls" || lower === "heuristics" || lower === "heuristics ls") {
				listHeuristicConfig();
				return;
			}
			if (lower.startsWith("heur set ") || lower.startsWith("heuristics set ")) {
				const payload = line.replace(/^heur(?:istics)?\s+set\s+/i, "");
				setHeuristicConfig(payload);
				return;
			}
			if (lower === "ac" || lower.startsWith("ac ")) {
				algebraicCommand("ac", line.slice(2));
				return;
			}
			if (lower === "assoc" || lower.startsWith("assoc ")) {
				algebraicCommand("assoc", line.slice(5));
				return;
			}
			if (lower === "comm" || lower.startsWith("comm ")) {
				algebraicCommand("comm", line.slice(4));
				return;
			}
			if (lower === "autobake" || lower.startsWith("autobake ")) {
				autobakeCommand(line.slice("autobake".length));
				return;
			}
			if (lower === "graph cap" || lower.startsWith("graph cap ")) {
				graphCapCommand(line.slice("graph cap".length));
				return;
			}
			if (lower === "narrow" || lower.startsWith("narrow ")) {
				narrowCommand(line.slice("narrow".length));
				return;
			}
			if (lower.startsWith("exists ") || lower === "exists") {
				existsCommand(line.slice(6).trim());
				return;
			}
			if (lower === "ml on") {
				state.ml.enabled = true;
				print("Machine learning mode enabled.");
				return;
			}
			if (lower === "ml off") {
				state.ml.enabled = false;
				print("Machine learning mode disabled (heuristics only).");
				return;
			}
			if (lower === "ml learn on" || lower === "ml learn off") {
				state.ml.ranker.learn = lower.endsWith("on");
				print(state.ml.ranker.learn
					? "ml learn on — every successful solve trains the edge ranker."
					: "ml learn off.");
				return;
			}
			if (lower === "ml rank on" || lower === "ml rank off") {
				state.ml.ranker.rank = lower.endsWith("on");
				print(state.ml.ranker.rank
					? "ml rank on — the learned ranker steers the search order."
					: "ml rank off.");
				return;
			}
			if (lower === "ml reset") {
				state.ml.ranker.weights = {};
				state.ml.ranker.examples = 0;
				state.ml.ranker.solves = 0;
				print("Edge ranker cleared.");
				return;
			}
			if (lower === "ml stats") {
				const r = state.ml.ranker;
				const entries = Object.entries(r.weights).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
				print(`Edge ranker: learn=${r.learn ? "on" : "off"}, rank=${r.rank ? "on" : "off"}`);
				print(`  trained on ${r.examples} edge${r.examples === 1 ? "" : "s"} from ${r.solves} solve${r.solves === 1 ? "" : "s"}`);
				if (entries.length === 0) {
					print("  (no weights learned yet)");
					return;
				}
				print("  strongest signals:");
				for (const [key, value] of entries.slice(0, 12)) {
					print(`    ${value >= 0 ? "+" : ""}${value.toFixed(3)}  ${key}`);
				}
				return;
			}
			if (lower === "ml" || lower === "ml help") {
				print("ML commands: ml on, ml off, ml train [function] [lo hi]...");
				print("  ml learn on|off  — train the edge ranker on each successful solve");
				print("  ml rank on|off   — let the learned ranker steer search order");
				print("  ml stats | ml reset");
				return;
			}
			if (lower.startsWith("ml train ")) {
				await mlTrainFunction(line.slice(9).trim());
				return;
			}
			if (lower === "evaluate") {
				print("Usage: evaluate [bound] [expression]", "err");
				return;
			}
			if (lower.startsWith("evaluate ")) {
				const match = line.match(/^evaluate\s+(\d+)\s+(.+)$/i);
				if (!match) {
					print("Usage: evaluate [bound] [expression]", "err");
					return;
				}
				try {
					await runEvaluateCommand(match[1], match[2]);
				} catch (e) {
					print(e.message || "Error", "err");
				}
				return;
			}
			if (lower === "path" || lower === "paths") {
				print("Usage: paths [maxVisited] [expression]", "err");
				return;
			}
			if (lower.startsWith("paths ") || lower.startsWith("path ")) {
				const match = line.match(/^paths?\s+(\d+)\s+(.+)$/i);
				if (!match) {
					print("Usage: paths [maxVisited] [expression]", "err");
					return;
				}
				try {
					await runPathsCommand(match[1], match[2]);
				} catch (e) {
					print(e.message || "Error", "err");
				}
				return;
			}
			if (lower === "walk" || lower === "walks") {
				print("Usage: walk [delayMs] [expression]", "err");
				return;
			}
			if (lower.startsWith("walk ") || lower.startsWith("walks ")) {
				const match = line.match(/^walks?\s+(\d+)\s+(.+)$/i);
				if (!match) {
					print("Usage: walk [delayMs] [expression]", "err");
					return;
				}
				try {
					await runWalkCommand(match[1], match[2]);
				} catch (e) {
					print(e.message || "Error", "err");
				}
				return;
			}

			try {
				if (line.includes("=")) {
					addRule(line);
				} else {
					await evaluateExpression(line);
				}
			} catch (e) {
				print(e.message || "Error", "err");
			}
		}

		const commandHistory = [];
		let historyIndex = -1;
		let historyDraft = "";

		input.addEventListener("keydown", (e) => {
			if (e.key === "ArrowUp") {
				if (commandHistory.length === 0) return;
				e.preventDefault();
				if (historyIndex === -1) {
					historyDraft = input.value;
					historyIndex = commandHistory.length - 1;
				} else if (historyIndex > 0) {
					historyIndex--;
				}
				input.value = commandHistory[historyIndex];
				input.setSelectionRange(input.value.length, input.value.length);
			} else if (e.key === "ArrowDown") {
				if (historyIndex === -1) return;
				e.preventDefault();
				if (historyIndex < commandHistory.length - 1) {
					historyIndex++;
					input.value = commandHistory[historyIndex];
				} else {
					historyIndex = -1;
					input.value = historyDraft;
				}
				input.setSelectionRange(input.value.length, input.value.length);
			} else if (e.key === "Enter") {
				const value = input.value;
				input.value = "";
				historyIndex = -1;
				historyDraft = "";
				if (value.trim()) commandHistory.push(value);
				handleCommand(value).catch((err) => {
					print(err?.message || "Error", "err");
				});
			}
		});

		setupGraphSettingsUI();
		welcome();
	</script>
